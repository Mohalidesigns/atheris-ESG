# Common configuration. Profile files: application-{local,test,staging,prod}.yml
# Secrets and connection details come from environment variables; there are no
# production defaults. Starting without JWT_SECRET fails (AS-IS S5).
spring:
  application:
    name: esg-platform

  # The application connects as a non-owner role so Row-Level Security applies (WP-11, TRD §4.1).
  # Flyway connects as the schema owner to run migrations.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/esg_dev}
    username: ${DB_USERNAME:esg_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DB_URL:jdbc:postgresql://localhost:5432/esg_dev}
    user: ${DB_OWNER_USERNAME:esg_owner}
    password: ${DB_OWNER_PASSWORD:}
    placeholders:
      app_role: ${DB_APP_ROLE:esg_app}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

esg:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /v1/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.esg: INFO
    org.springframework.security: INFO
