# Common configuration. Profile files: application-{local,test,staging,prod}.yml
# Secrets and connection details come from environment variables; there are no
# production defaults. Starting without JWT_SECRET fails (AS-IS S5).
spring:
  application:
    name: esg-platform

  # The application connects as a non-owner role so Row-Level Security applies (WP-11, TRD §4.1).
  # Flyway connects as the schema owner to run migrations.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/esg_dev}
    username: ${DB_USERNAME:esg_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DB_URL:jdbc:postgresql://localhost:5432/esg_dev}
    user: ${DB_OWNER_USERNAME:esg_owner}
    password: ${DB_OWNER_PASSWORD:}
    placeholders:
      app_role: ${DB_APP_ROLE:esg_app}

  servlet:
    multipart:
      # TRD §6.6.4: 50 MB per upload (esg.files.max-bytes enforces the exact limit with a clear error).
      max-file-size: 50MB
      max-request-size: 51MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

esg:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: 900000
    refresh-expiration-ms: 604800000
    # AES-256 key (base64, 32 bytes) for secrets stored in the database, e.g. MFA seeds. Required outside local/test.
    data-encryption-key: ${DATA_ENCRYPTION_KEY}
    # Refresh-token cookie is Secure (HTTPS only) everywhere except local development.
    cookie-secure: true
    mfa:
      # TOTP is mandatory for roles flagged mfa_required (SUPER_ADMIN, TENANT_ADMIN, ESG_DIRECTOR; TRD/WP-12, S1) in
      # every profile. dev-bypass skips it for local experiments only: logs a startup warning; refused in staging/prod.
      dev-bypass: ${MFA_DEV_BYPASS:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  files:
    storage: ${FILES_STORAGE:s3}           # s3 (AWS S3 / MinIO) | filesystem (local/test only)
    local-dir: ${FILES_LOCAL_DIR:./var/files}
    max-bytes: 52428800                    # 50 MB (TRD §6.6.4)
    presign-ttl: PT10M
    # Virus scanning (S6): clamav (clamd INSTREAM over TCP; required in staging/prod) | sandbox (local/test, EICAR only).
    scanner: ${FILES_SCANNER:clamav}
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      timeout-ms: 30000
    rescan:
      # Files left pending (scanner unreachable at upload) are retried on this schedule.
      enabled: true
      interval-ms: 120000
    s3:
      endpoint: ${S3_ENDPOINT:}            # empty = AWS; http://localhost:9000 for MinIO
      region: ${S3_REGION:af-south-1}
      bucket: ${S3_BUCKET:atheris-esg-files}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      server-side-encryption: ${S3_SSE:true}
      create-bucket: false
  social:
    escalation:
      # Daily escalation of community grievances past their resolution due date (WP-33, TRD §8.7).
      enabled: true
      cron: "0 45 6 * * *"
      zone: Africa/Lagos
  reporting:
    sla:
      # Daily reminder for report approval steps past their 5-day SLA (TRD §8.4).
      enabled: true
      cron: "0 30 6 * * *"
      zone: Africa/Lagos
  compliance:
    reminders:
      # Daily filing-deadline reminders (TRD §8.3 DeadlineScheduler); times are Lagos time.
      enabled: true
      cron: "0 0 6 * * *"
      zone: Africa/Lagos
  notifications:
    dispatcher:
      enabled: true
      interval-ms: 10000
    email:
      from: ${MAIL_FROM:no-reply@atheris-esg.local}
    sms:
      # Africa's Talking sandbox (CLAUDE.md rule 9: labelled "Sandbox" in the UI). Empty key = SMS not configured.
      africastalking-username: ${AT_USERNAME:sandbox}
      africastalking-api-key: ${AT_API_KEY:}
      africastalking-url: ${AT_URL:https://api.sandbox.africastalking.com/version1/messaging}

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /v1/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.esg: INFO
    org.springframework.security: INFO
