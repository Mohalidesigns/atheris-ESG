# Automated tests. Integration tests get their datasource from Testcontainers
# (@ServiceConnection) once the WP-18 harness lands.
esg:
  security:
    jwt-secret: ${JWT_SECRET:test-only-signing-key-used-by-automated-tests-0123456789abcdef0123}
    data-encryption-key: ${DATA_ENCRYPTION_KEY:S5gZx/LBue1vcvNZoRCnZrSAJI+G1tekOSj6v5Is6Y0=}
    cookie-secure: false

  testing:
    # Phase 3 (7): requests with X-ESG-Test-Run mark what they create as test data (E2E cleans up after itself).
    test-data-marking: true
  files:
    storage: filesystem
    local-dir: ${java.io.tmpdir}/esg-test-files
    scanner: sandbox
    rescan:
      enabled: false   # tests drive VirusScanService.runOnce() directly
  social:
    escalation:
      enabled: false   # tests drive GrievanceService.runAll(clock) with a shifted clock
  reporting:
    sla:
      enabled: false   # tests drive ApprovalSlaService.runAll() with a fixed clock
  compliance:
    reminders:
      enabled: false   # tests drive DeadlineReminderService.run(date) directly (time travel)
  notifications:
    dispatcher:
      enabled: false   # tests drive NotificationDispatcher.runOnce() directly

logging:
  level:
    com.esg: INFO
