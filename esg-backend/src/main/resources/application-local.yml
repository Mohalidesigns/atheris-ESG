# Local development only. Started by scripts/dev.sh.
spring:
  flyway:
    # db/seed/local sets known passwords for demo users (see README). Never add it to other profiles.
    locations: classpath:db/migration,classpath:db/seed/local

esg:
  security:
    # Development-only signing key. Real environments must set JWT_SECRET.
    jwt-secret: ${JWT_SECRET:local-dev-only-signing-key-not-for-any-shared-environment-0123456789abcdef}
    data-encryption-key: ${DATA_ENCRYPTION_KEY:YS0bCdEHVNXWPBZwaz5BaQrw7vGZoHjF+yTlWjZMnFw=}
    cookie-secure: false   # plain http://localhost
    # MFA is enforced locally too (S1). Seeded admin/director accounts have known dev-only TOTP secrets (db/seed/README.md).
  ai:
    # esg-ai on its default port (scripts/dev.sh starts it when its virtualenv exists). Dev-only token.
    url: ${ESG_AI_URL:http://localhost:8090}
    token: ${ESG_AI_TOKEN:local-dev-ai-token}
  webhooks:
    # Local development: receivers on http://localhost are allowed (never in production, WebhookUrlPolicy).
    allow-http: true
    allow-private-networks: true
    dispatch:
      interval-ms: 3000
  testing:
    # Phase 3 (7): requests with X-ESG-Test-Run mark what they create as test data (E2E cleans up after itself).
    test-data-marking: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

  files:
    storage: ${FILES_STORAGE:filesystem}   # MinIO via docker compose: FILES_STORAGE=s3 S3_ENDPOINT=http://localhost:9000
    # Sandbox scanner (EICAR only, labelled in the UI) unless you run ClamAV: FILES_SCANNER=clamav CLAMAV_HOST=localhost
    scanner: ${FILES_SCANNER:sandbox}
    s3:
      create-bucket: true

logging:
  level:
    com.esg: DEBUG
