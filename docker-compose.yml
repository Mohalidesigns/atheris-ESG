# Local development stack (WP-10). Start everything with ./scripts/dev.sh
# PostgreSQL is published on 5433 so it doesn't clash with a locally installed server on 5432.
# No Kafka: D1 = modular monolith with in-process events + transactional outbox.
name: atheris-esg

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      ESG_OWNER_PASSWORD: ${ESG_OWNER_PASSWORD:-esg_owner_local}
    ports:
      - "${ESG_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esg_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: esg-local
      MINIO_ROOT_PASSWORD: esg-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
