# CI backbone (WP-10). Every PR and push to main must pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build, test, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esg-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'   # D6
          cache: maven
      - name: Verify (unit + Testcontainers integration tests incl. RLS suite, JaCoCo, Checkstyle)
        # Coverage ratchet (master plan §7.1): raise the floor as coverage grows; local runs default to 0.
        run: ./mvnw -B verify -Djacoco.line.minimum=0.70
      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "Line coverage: %.1f%% (%d/%d)\n", (c/(m+c))*100, c, m+c}' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-reports
          path: |
            esg-backend/target/site/jacoco/
            esg-backend/target/surefire-reports/
            esg-backend/target/checkstyle-result.xml

  frontend:
    name: Frontend lint, test, build, no-mock gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esg-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: esg-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Bundle budget (WP-53)
        run: node ../scripts/check-bundle-size.mjs
      - name: No-mock gate (ENFORCE since WP-16)
        run: |
          npm run -s check:no-mocks -- --report no-mock-report.md
          cat no-mock-report.md >> "$GITHUB_STEP_SUMMARY"
          npm run -s check:no-mocks -- --enforce
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: no-mock-report
          path: esg-frontend/no-mock-report.md

  e2e:
    name: E2E journeys (Cypress)
    # WP-18: master plan §7.3 journeys against a real backend on a clean, seeded database (local demo seed).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17   # D11
        env:
          POSTGRES_USER: esg_owner
          POSTGRES_PASSWORD: esg_owner_ci
          POSTGRES_DB: esg_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U esg_owner -d esg_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/esg_e2e
      DB_USERNAME: esg_app
      DB_PASSWORD: esg_app_ci
      DB_OWNER_USERNAME: esg_owner
      DB_OWNER_PASSWORD: esg_owner_ci
      ESG_AI_URL: http://localhost:8090
      ESG_AI_TOKEN: ci-ai-token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: esg-frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: esg-ai/requirements.txt
      - name: Start AI service (WP-50; no language model in CI, so extraction journeys are skipped)
        working-directory: esg-ai
        run: |
          python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
          ESG_AI_TOKEN=ci-ai-token .venv/bin/uvicorn app.main:app --port 8090 > ../ai.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8090/v1/health && break; sleep 1; done
      - name: Create application role (no superuser, no BYPASSRLS)
        run: |
          PGPASSWORD=esg_owner_ci psql -h localhost -U esg_owner -d esg_e2e -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE esg_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'esg_app_ci'" \
            -c "GRANT CONNECT ON DATABASE esg_e2e TO esg_app"
      - name: Start backend (local profile = seeded demo tenant)
        working-directory: esg-backend
        run: |
          ./mvnw -B -q package -DskipTests -Dcheckstyle.skip -Djacoco.skip
          java -jar target/esg-platform-*.jar --spring.profiles.active=local --server.port=8080 > ../backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8080/api/actuator/health && break; sleep 2; done
          curl -sf localhost:8080/api/actuator/health || (tail -100 ../backend.log; exit 1)
      - name: Build and serve frontend
        working-directory: esg-frontend
        run: |
          npm ci
          npm run build
          VITE_BACKEND_URL=http://localhost:8080 npx vite preview --port 4173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4173/login >/dev/null && break; sleep 1; done
      - name: Cypress journeys
        working-directory: esg-frontend
        run: npx cypress run
        env:
          E2E_BASE_URL: http://localhost:4173
      - name: OWASP ZAP baseline (WP-52)
        # Passive scan of the web app and API behind it while the stack is up; fails on FAIL-level alerts only.
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:4173 -r zap-baseline.html -J zap-baseline.json -I
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            esg-frontend/cypress/screenshots/
            backend.log
            frontend.log
            ai.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-baseline
          path: zap/

  ai:
    name: AI service tests (pytest)
    # WP-50 (D38): forecasting golden values, Isolation Forest, grounded extraction with a fake language model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: esg-ai/requirements-dev.txt
      - name: pytest
        working-directory: esg-ai
        run: |
          python -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/python -m pytest -q

  security:
    name: Security scans (secrets, dependencies)
    # WP-52 (D40): no secrets in the history; no HIGH/CRITICAL vulnerability with a fix in any dependency set
    # (backend jar, frontend lockfile, AI service requirements).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secrets (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build backend jar
        working-directory: esg-backend
        run: ./mvnw -B -q package -DskipTests -Dcheckstyle.skip -Djacoco.skip
      - name: Dependencies (Trivy)
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b . v0.75.0
          opts="--quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --timeout 30m"
          ./trivy rootfs $opts esg-backend/target/esg-platform-1.0.0-SNAPSHOT.jar
          ./trivy fs $opts esg-frontend/package-lock.json
          ./trivy fs $opts esg-ai/requirements.txt

  openapi:
    name: OpenAPI spec + breaking-change diff
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17   # D11
        env:
          POSTGRES_USER: esg_owner
          POSTGRES_PASSWORD: esg_owner_ci
          POSTGRES_DB: esg_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U esg_owner -d esg_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/esg_dev
      DB_USERNAME: esg_app            # non-owner application role (WP-11, RLS applies)
      DB_PASSWORD: esg_app_ci
      DB_OWNER_USERNAME: esg_owner    # Flyway migrations
      DB_OWNER_PASSWORD: esg_owner_ci
      JWT_SECRET: ci-only-signing-key-for-openapi-generation-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Create application role
        run: |
          PGPASSWORD=esg_owner_ci psql -h localhost -U esg_owner -d esg_dev -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE esg_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'esg_app_ci'" \
            -c "GRANT CONNECT ON DATABASE esg_dev TO esg_app"
      - name: Build and export spec
        working-directory: esg-backend
        run: |
          ./mvnw -B -q package -DskipTests -Dcheckstyle.skip -Djacoco.skip
          java -jar target/esg-platform-*.jar --spring.profiles.active=test --server.port=8080 > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/api/actuator/health && break; sleep 2; done
          curl -sf localhost:8080/api/v1/api-docs -o ../openapi.json || (cat app.log; exit 1)
      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: openapi.json
      - name: Export base branch spec
        if: github.event_name == 'pull_request'
        continue-on-error: true   # base may predate WP-10 and use different config
        run: |
          pkill -f esg-platform || true
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../base FETCH_HEAD
          cd ../base/esg-backend
          ./mvnw -B -q package -DskipTests -Dcheckstyle.skip -Djacoco.skip
          java -jar target/esg-platform-*.jar --spring.profiles.active=test --server.port=8081 > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8081/api/actuator/health && break; sleep 2; done
          curl -sf localhost:8081/api/v1/api-docs -o "$GITHUB_WORKSPACE/openapi-base.json"
      - name: Breaking changes (oasdiff)
        if: github.event_name == 'pull_request' && hashFiles('openapi-base.json') != ''
        run: |
          docker run --rm -v "$PWD:/specs" tufin/oasdiff breaking /specs/openapi-base.json /specs/openapi.json --format markdown > oasdiff.md || true
          { echo "## OpenAPI breaking changes"; cat oasdiff.md; } >> "$GITHUB_STEP_SUMMARY"
