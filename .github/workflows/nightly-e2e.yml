# Nightly full-stack run (WP-10). Brings up the docker compose stack and the backend,
# then runs the E2E suite. Cypress journeys are added by WP-18 (D3); until then this
# job is a stack smoke test.
name: Nightly E2E

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-signing-key-for-nightly-e2e-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: esg-frontend/package-lock.json
      - name: Start compose stack
        run: docker compose up -d --wait
      - name: Start backend (local profile, compose Postgres on 5433)
        working-directory: esg-backend
        env:
          DB_URL: jdbc:postgresql://localhost:5433/esg_dev
          DB_USERNAME: esg_owner
          DB_PASSWORD: esg_owner_local
        run: |
          ./mvnw -B -q package -DskipTests -Dcheckstyle.skip -Djacoco.skip
          java -jar target/esg-platform-*.jar --spring.profiles.active=local > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/api/actuator/health && break; sleep 2; done
          curl -sf localhost:8080/api/actuator/health
      - name: Smoke - login with local seed user
        run: |
          curl -sf -X POST localhost:8080/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"adaeze.usman@esgpro.ng","password":"LocalDev!2026"}' > /dev/null
      - name: E2E journeys (Cypress, added in WP-18)
        run: echo "No E2E journeys yet - see docs/esg-completion/wp/WP-18.md"
      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose logs --no-color | tail -200
          tail -200 esg-backend/app.log || true
