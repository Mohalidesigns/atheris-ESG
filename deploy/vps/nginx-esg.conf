# Host nginx site for Atheris ESG on the shared GRC VPS → /etc/nginx/sites-available/esg
# Security headers match deploy/nginx.conf (keep the two in step). TLS lines are added by certbot (README step 6).
# The web app is served from /var/www/esg/web (deploy/vps/deploy.sh); the API is the backend on 127.0.0.1:8085;
# /atheris-esg-files/ is the S3 store (SeaweedFS), for pre-signed evidence downloads (bucket name = S3_BUCKET).

server {
    listen 80;
    listen [::]:80;
    server_name esg.atherislimited.com;

    root /var/www/esg/web;
    server_tokens off;
    client_max_body_size 51m;                 # esg.files.max-bytes is 50 MB; multipart overhead on top

    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Spring Boot (context path /api).
    location /api/ {
        proxy_pass http://127.0.0.1:8085/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;          # stream uploads to the backend
    }

    # S3 store. The public may only follow pre-signed download links (GET/HEAD); the backend writes over loopback
    # (extra_hosts in docker-compose.vps.yml). The signature covers the host: keep Host as sent.
    location /atheris-esg-files/ {
        limit_except GET HEAD { allow 127.0.0.1; deny all; }
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 51m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Single-page app: everything else is index.html, never cached; the service worker must not be cached either.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
