# WP-54: single-host pilot deployment (one organisation or a few). For larger installations use a managed PostgreSQL,
# S3 and a container platform with the same images and variables (docs/release/DEPLOYMENT.md).
#   cp deploy/.env.example deploy/.env   # fill every CHANGE_ME from your secrets manager
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# TLS terminates in front of `frontend` (load balancer or reverse proxy); only that port is published.
name: atheris-esg

services:
  frontend:
    build: { context: .., dockerfile: deploy/frontend.Dockerfile }
    ports: ["${HTTP_PORT:-8080}:8080"]
    depends_on: [backend]
    restart: unless-stopped

  backend:
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/esg
      DB_USERNAME: esg_app
      DB_PASSWORD: ${ESG_APP_PASSWORD}
      DB_OWNER_USERNAME: esg_owner
      DB_OWNER_PASSWORD: ${ESG_OWNER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      ESG_PUBLIC_URL: ${PUBLIC_URL}
      FILES_STORAGE: s3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      FILES_SCANNER: clamav
      CLAMAV_HOST: clamav
      SPRING_MAIL_HOST: ${SMTP_HOST}
      SPRING_MAIL_PORT: ${SMTP_PORT}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      AT_USERNAME: ${AT_USERNAME}
      AT_API_KEY: ${AT_API_KEY}
      AT_URL: ${AT_URL}
      ESG_AI_URL: http://ai:8090
      ESG_AI_TOKEN: ${ESG_AI_TOKEN}
      # First start only (D42): the platform administrator; ignored once one exists. Remove after the first sign-in.
      ESG_BOOTSTRAP_ADMIN_EMAIL: ${ESG_BOOTSTRAP_ADMIN_EMAIL:-}
      ESG_BOOTSTRAP_ADMIN_PASSWORD: ${ESG_BOOTSTRAP_ADMIN_PASSWORD:-}
      ESG_BOOTSTRAP_ORGANISATION: ${ESG_BOOTSTRAP_ORGANISATION:-Platform operator}
    depends_on:
      postgres: { condition: service_healthy }
      clamav: { condition: service_started }
    restart: unless-stopped

  ai:
    build: { context: .., dockerfile: deploy/ai.Dockerfile }
    environment:
      ESG_AI_TOKEN: ${ESG_AI_TOKEN}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-granite4:micro}
    restart: unless-stopped

  # IBM Granite via Ollama (D12). Pull the model once: docker compose exec ollama ollama pull granite4:micro
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      ESG_OWNER_PASSWORD: ${ESG_OWNER_PASSWORD}
      ESG_APP_PASSWORD: ${ESG_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esg"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
